name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Ruby syntax
        run: |
          ruby -c lib/overlay.rb
          ruby -c scripts/build.rb
          ruby -c scripts/validate.rb
          ruby -c test/test_overlay.rb

      - name: Shell syntax
        run: |
          bash -n bin/mpk
          bash -n providers/smart-config-kit/provider.sh
          bash -n scripts/codex-next.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/codex-next.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Unit tests
        run: ruby test/test_overlay.rb

      - name: Doctor
        run: bash bin/mpk doctor

  windows-powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell on native Windows
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/codex-next.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
