name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Ruby syntax
        run: |
          ruby -c lib/overlay.rb
          ruby -c lib/build_helpers.rb
          ruby -c lib/publisher.rb
          ruby -c lib/publisher/build_id.rb
          ruby -c lib/publisher/runtime.rb
          ruby -c lib/publisher/token.rb
          ruby -c lib/publisher/validator.rb
          ruby -c lib/publisher/publisher.rb
          ruby -c scripts/build.rb
          ruby -c scripts/validate.rb
          ruby -c scripts/publisher.rb
          ruby -c test/test_overlay.rb
          ruby -c test/test_build_helpers.rb
          ruby -c test/test_e2e_offline.rb
          ruby -c test/publisher/test_build_id.rb
          ruby -c test/publisher/test_token.rb
          ruby -c test/publisher/test_publisher.rb
          ruby -c test/publisher/test_publisher_secret.rb
          ruby -c test/publisher/test_publisher_integration.rb
          ruby -c test/publisher/test_publisher_fault_injection.rb
          ruby -c test/publisher/test_publisher_crash_recovery.rb
          ruby -c test/publisher/test_publisher_staging_atomicity.rb

      - name: Shell syntax
        run: |
          bash -n bin/mpk
          bash -n providers/smart-config-kit/provider.sh
          bash -n scripts/codex-next.sh
          bash -n test/providers/test_smart_config_kit.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/codex-next.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Ruby unit tests
        run: |
          ruby test/test_overlay.rb
          ruby test/test_build_helpers.rb
          ruby test/publisher/test_build_id.rb
          ruby test/publisher/test_token.rb
          ruby test/publisher/test_publisher.rb
          ruby test/publisher/test_publisher_secret.rb
          ruby test/publisher/test_publisher_fault_injection.rb
          ruby test/publisher/test_publisher_crash_recovery.rb
          ruby test/publisher/test_publisher_staging_atomicity.rb
          ruby test/publisher/test_nginx_example.rb

      - name: Provider wrapper fixture test
        run: bash test/providers/test_smart_config_kit.sh

      - name: Offline end-to-end integration test
        run: ruby test/test_e2e_offline.rb

      - name: Publisher integration (atomic active pointer / token URL)
        run: ruby test/publisher/test_publisher_integration.rb

      - name: Nginx config syntax (if nginx available)
        run: |
          if command -v nginx >/dev/null 2>&1; then
            # 示例文件是 server 块片段；包一层 events/http 块做 nginx -t 语法验证。
            # 使用临时 prefix 避免污染系统 error_log / pid 路径。
            mkdir -p /tmp/mpk-nginx-prefix/logs
            # nginx -t 会实际加载证书：生成占位自签名证书用于语法验证（非生产）
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/mpk-nginx-prefix/privkey.pem \
              -out /tmp/mpk-nginx-prefix/fullchain.pem -days 1 -nodes \
              -subj '/CN=example.invalid' >/dev/null 2>&1
            sed 's/<YOUR-DOMAIN>/example.invalid/g; s#<YOUR-CERT-PATH>#/tmp/mpk-nginx-prefix#g; s/listen 443 ssl/listen 8443 ssl/' \
              deploy/nginx/mihomo-subscription.conf.example > /tmp/mpk-server.conf
            {
              echo "pid /tmp/mpk-nginx-prefix/nginx.pid;"
              echo "error_log /tmp/mpk-nginx-prefix/logs/error.log;"
              echo 'events {}'
              echo 'http {'
              echo 'access_log /tmp/mpk-nginx-prefix/logs/access.log;'
              cat /tmp/mpk-server.conf
              echo '}'
            } > /tmp/mpk-nginx-test.conf
            nginx -t -p /tmp/mpk-nginx-prefix -c /tmp/mpk-nginx-test.conf
          else
            echo "nginx not found; skipping nginx -t (deterministic text check only)"
            grep -q 'access_log off' deploy/nginx/mihomo-subscription.conf.example
            grep -q 'log_not_found off' deploy/nginx/mihomo-subscription.conf.example
            grep -q 'autoindex off' deploy/nginx/mihomo-subscription.conf.example
            grep -q 'X-Robots-Tag' deploy/nginx/mihomo-subscription.conf.example
          fi

      - name: Doctor
        run: bash bin/mpk doctor

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate PowerShell on native Windows
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/codex-next.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Smoke test task picker with mocked gh
        shell: pwsh
        run: |
          $mockDir = Join-Path $env:RUNNER_TEMP 'mpk-mock-gh'
          New-Item -ItemType Directory -Path $mockDir -Force | Out-Null

          @'
          @echo off
          if "%1 %2"=="auth status" exit /b 0
          if "%1 %2"=="issue list" (
            echo 5
            exit /b 0
          )
          if "%1 %2 %3"=="issue view 5" (
            echo %* | findstr /C:"--json title" >nul && (
              echo [READY][V0.1-T01] test task
              exit /b 0
            )
            echo %* | findstr /C:"--json url" >nul && (
              echo https://github.com/gloryhui/mihomo-policy-kit/issues/5
              exit /b 0
            )
          )
          exit /b 1
          '@ | Set-Content -Path (Join-Path $mockDir 'gh.cmd') -Encoding ascii

          $env:PATH = "$mockDir;$env:PATH"
          $output = & pwsh -NoProfile -File .\scripts\codex-next.ps1
          if ($LASTEXITCODE -ne 0) {
            $output | Write-Host
            exit $LASTEXITCODE
          }

          $text = ($output | Out-String)
          $text | Write-Host
          if ($text -notmatch 'NEXT_ISSUE=5') { throw 'missing issue number' }
          if ($text -notmatch 'TITLE=\[READY\]\[V0\.1-T01\] test task') { throw 'missing title' }
          if ($text -notmatch 'issues/5') { throw 'missing URL' }

      - name: Ruby syntax on Windows
        shell: pwsh
        run: |
          ruby -c lib/overlay.rb
          ruby -c lib/build_helpers.rb
          ruby -c lib/publisher.rb
          ruby -c lib/publisher/build_id.rb
          ruby -c lib/publisher/runtime.rb
          ruby -c lib/publisher/token.rb
          ruby -c lib/publisher/validator.rb
          ruby -c lib/publisher/publisher.rb
          ruby -c scripts/publisher.rb

      - name: Ruby generic logic tests on Windows
        shell: pwsh
        run: |
          ruby test/test_overlay.rb
          ruby test/test_build_helpers.rb
          ruby test/publisher/test_build_id.rb
          ruby test/publisher/test_token.rb
          ruby test/publisher/test_publisher.rb
          ruby test/publisher/test_publisher_secret.rb
          ruby test/publisher/test_publisher_fault_injection.rb
          ruby test/publisher/test_publisher_crash_recovery.rb
          ruby test/publisher/test_publisher_staging_atomicity.rb
          ruby test/publisher/test_nginx_example.rb
