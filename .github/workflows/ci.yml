name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Ruby syntax
        run: |
          ruby -c lib/overlay.rb
          ruby -c scripts/build.rb
          ruby -c scripts/validate.rb
          ruby -c test/test_overlay.rb

      - name: Shell syntax
        run: |
          bash -n bin/mpk
          bash -n providers/smart-config-kit/provider.sh
          bash -n scripts/codex-next.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/codex-next.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Unit tests
        run: ruby test/test_overlay.rb

      - name: Doctor
        run: bash bin/mpk doctor

  windows-powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell on native Windows
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/codex-next.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Smoke test task picker with mocked gh
        shell: pwsh
        run: |
          $mockDir = Join-Path $env:RUNNER_TEMP 'mpk-mock-gh'
          New-Item -ItemType Directory -Path $mockDir -Force | Out-Null

          @'
          @echo off
          if "%1 %2"=="auth status" exit /b 0
          if "%1 %2"=="issue list" (
            echo 5
            exit /b 0
          )
          if "%1 %2 %3"=="issue view 5" (
            echo %* | findstr /C:"--json title" >nul && (
              echo [READY][V0.1-T01] test task
              exit /b 0
            )
            echo %* | findstr /C:"--json url" >nul && (
              echo https://github.com/gloryhui/mihomo-policy-kit/issues/5
              exit /b 0
            )
          )
          exit /b 1
          '@ | Set-Content -Path (Join-Path $mockDir 'gh.cmd') -Encoding ascii

          $env:PATH = "$mockDir;$env:PATH"
          $output = & pwsh -NoProfile -File .\scripts\codex-next.ps1
          if ($LASTEXITCODE -ne 0) {
            $output | Write-Host
            exit $LASTEXITCODE
          }

          $text = ($output | Out-String)
          $text | Write-Host
          if ($text -notmatch 'NEXT_ISSUE=5') { throw 'missing issue number' }
          if ($text -notmatch 'TITLE=\[READY\]\[V0\.1-T01\] test task') { throw 'missing title' }
          if ($text -notmatch 'issues/5') { throw 'missing URL' }
